[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-mathagent-s2"
version = "0.9.8"
description = "Controller-owned Intern S2 mathematics runtime"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12,<2", "numpy>=1.24,<3", "scipy>=1.10,<2", "requests>=2.28,<3"]

[tool.setuptools]
py-modules = ["user_agent"]

[tool.setuptools.packages.find]
include = ["mathagent*", "math_families*"]
exclude = ["tests*", "math_families.tests*"]

[tool.setuptools.package-data]
mathagent = ["resources/*.json", "resources/skills/*.md"]
math_families = ["catalog.json", "skills/*.md", "README.md"]

[tool.setuptools.data-files]
"." = ["pyproject.toml", "requirements.txt"]
"scripts" = ["scripts/score_reference_judge.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
